<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glowup By K</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:oklch(.955 .008 80);font-family:Jost,system-ui,sans-serif}
  .shop{width:100%;max-width:430px;margin:0 auto;background:oklch(.99 .004 80)}
  .top{background:oklch(.22 .01 70);padding:20px 22px 34px;color:oklch(.95 .01 80)}
  .bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:oklch(.78 .01 80)}
  .logo{font-family:Newsreader,serif;font-size:21px;color:oklch(.96 .01 80)}
  .kicker{margin:30px 0 0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:oklch(.72 .03 60)}
  h1{margin:10px 0 0;font-family:Newsreader,serif;font-weight:300;font-size:33px;line-height:1.18;text-wrap:pretty}
  .rayon{padding:30px 22px 0}
  .rayon-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid oklch(.88 .01 80);padding-bottom:10px}
  h2{margin:0;font-family:Newsreader,serif;font-weight:400;font-size:22px;color:oklch(.26 .01 80)}
  .count{font-family:ui-monospace,monospace;font-size:11px;color:oklch(.62 .01 80)}
  .blurb{margin:12px 0 0;font-size:13px;line-height:1.6;color:oklch(.5 .01 80)}
  .item{display:flex;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid oklch(.93 .008 80);text-decoration:none;color:inherit}
  .tile{width:76px;height:88px;flex:none;display:flex;align-items:center;justify-content:center}
  .tile.dark{background:oklch(.16 .005 70)}
  .tile.light{background:oklch(.955 .004 80);padding:6px}
  .tile img{width:100%;height:100%;object-fit:contain}
  .info{display:flex;flex-direction:column;flex:1;min-width:0}
  .brand{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:oklch(.62 .02 60)}
  .name{margin-top:4px;font-size:15px;line-height:1.3;color:oklch(.24 .01 80)}
  .note{margin-top:5px;font-size:12px;line-height:1.45;color:oklch(.56 .01 80)}
  .legal{padding:30px 22px 34px;margin:0;font-size:12px;line-height:1.7;color:oklch(.58 .01 80)}
</style>
</head>
<body>
<div class="shop">
  <div class="top">
    <div class="bar"><span class="logo">Glowup By K</span><span>Recherche</span></div>
    <p class="kicker">Bien-être quotidien</p>
    <h1>Trois rayons, une routine complète.</h1>
  </div>
  <div id="app"></div>
  <p class="legal">Compléments alimentaires. Ne remplacent pas une alimentation variée et équilibrée.</p>
</div>
<script>
const SHOP = "https://shop.jifu.com/fr/fr/Kcoaching/product/";
const T = "uploads/thumbs/";
const RAW = [
 ["STM SKIN","Cleanser","stmskincleanser","dark","Soin visage","Nettoyant doux, matin et soir","stm-cleanser-1"],
 ["STM SKIN","Serum","stmskin","dark","Soin visage","Sérum peptides, éclat","stm-serum-1"],
 ["STM SKIN","Day Cream","stmskinday","dark","Soin visage","Hydratation de jour","stm-moisturizer-1"],
 ["STM SKIN","Night Cream","stmskinnight","dark","Soin visage","Crème réparatrice de nuit","stm-night-1"],
 ["GLŌ","Daily Cleanser","glodaily","light","Soin visage","Nettoyer, hydrater, restaurer","glo-cleanser-1"],
 ["GLŌ","Night Repair Complex","glonight","light","Soin visage","Ridules et rides","glo-night-1"],
 ["GLŌ","Cell Restoration Serum","glo","light","Soin visage","Sérum restaurateur","glo-serum-1"],
 ["GLŌ","Eye Repair Treatment","gloeye","light","Soin visage","Contour des yeux","glo-eye-1"],
 ["JIFU","STM","stm","dark","Compléments","30 gélules, niveau cellulaire","stm-1"],
 ["STM","OMG","stmomg","dark","Compléments","60 capsules, oméga-3 et vitamine D","stm-omg-1"],
 ["JIFU","Gen3 Collagen Matrix Drink","gen3","dark","Boissons","Collagène, framboise","gen3-1"],
 ["JIFU","Gen3 Collagen Matrix Drink — 2 pots","gen3fois2","dark","Boissons","Format duo","gen3-2"],
 ["LIV","Superfruit Antioxidant Blend","packliv","light","Boissons","30 sachets, fruits rouges","liv-gel-1"],
 ["LIV","Superfruit Antioxidant Blend ×2","liv","light","Boissons","Deux coffrets","liv-gel-2-eu"],
 ["JIFU","Pulse Instant Coffee","pulse","light","Boissons","Café moulu, torréfaction moyenne","pulse-ins-coffee-1"]
];
const BLURBS = {
 "Soin visage":"Nettoyants, sérums et crèmes pour une routine matin et soir.",
 "Compléments":"Formules quotidiennes en gélules et capsules.",
 "Boissons":"Sachets, poudres et café à préparer en une minute."
};
const html = ["Soin visage","Compléments","Boissons"].map(cat => {
  const items = RAW.filter(p => p[4] === cat);
  return `<div class="rayon">
    <div class="rayon-head"><h2>${cat}</h2><span class="count">${String(items.length).padStart(2,"0")}</span></div>
    <p class="blurb">${BLURBS[cat]}</p>
    ${items.map(([brand,name,img,tone,,note,slug]) => `
    <a class="item" href="${SHOP}${slug}" target="_blank" rel="noopener">
      <span class="tile ${tone}"><img src="${T}${img}.png" alt="${brand} ${name}" loading="lazy"></span>
      <span class="info"><span class="brand">${brand}</span><span class="name">${name}</span><span class="note">${note}</span></span>
    </a>`).join("")}
  </div>`;
}).join("");
document.getElementById("app").innerHTML = html;
</script>
</body>
</html>
